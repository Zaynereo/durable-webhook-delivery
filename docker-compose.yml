services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhooks"]
      interval: 2s
      timeout: 5s
      retries: 15

  sink:
    build:
      context: .
      args:
        TARGET: sink
    environment:
      HMAC_SECRET: dev-hmac-secret-change-me
      LISTEN_ADDR: ":9090"
    ports:
      - "9090:9090"

  api:
    build:
      context: .
      args:
        TARGET: api
    environment:
      DATABASE_URL: postgres://webhook:webhook@postgres:5432/webhooks?sslmode=disable
      LISTEN_ADDR: ":8080"
      HMAC_SECRET: dev-hmac-secret-change-me
      ALLOWED_DESTINATIONS: http://sink:9090/webhook,http://localhost:9090/webhook
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        TARGET: worker
    environment:
      DATABASE_URL: postgres://webhook:webhook@postgres:5432/webhooks?sslmode=disable
      HMAC_SECRET: dev-hmac-secret-change-me
      ALLOWED_DESTINATIONS: http://sink:9090/webhook,http://localhost:9090/webhook
      WORKER_ID: worker-1
      MAX_DELIVERY_ATTEMPTS: "5"
      INITIAL_BACKOFF: 2s
      POLL_INTERVAL: 500ms
    depends_on:
      postgres:
        condition: service_healthy
      sink:
        condition: service_started
